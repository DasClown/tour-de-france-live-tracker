name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run unit + integration tests (no live server)
        # E2E tests need a running tdf-tracker service; they self-skip
        # in CI, but we exclude them explicitly for clarity and speed.
        run: pytest -m "not e2e" --tb=short -v

      - name: Test summary
        if: always()
        run: |
          echo "## Test results" >> $GITHUB_STEP_SUMMARY
          echo "Python ${{ matrix.python-version }}" >> $GITHUB_STEP_SUMMARY
          pytest -m "not e2e" -q --tb=no 2>&1 | tail -5 >> $GITHUB_STEP_SUMMARY
